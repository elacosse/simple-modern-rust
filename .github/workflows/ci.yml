name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - run: cargo install typos-cli --version 1.38.1 --locked
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.16.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo build --locked
      - run: cargo test --locked --all-features
